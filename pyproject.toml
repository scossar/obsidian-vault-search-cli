[project]
name = "obsidian-vault"
version = "0.1.0"
description = "Incremental chunking, local embeddings, and semantic search for Obsidian vaults"
readme = "README.md"
authors = [
    { name = "Simon Cossar", email = "scossar3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "markdown-it-py>=4.2.0",
    "python-frontmatter>=1.3.0",
    "rich>=15.0.0",
]

[project.scripts]
obsidian-vault = "obsidian_vault:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
